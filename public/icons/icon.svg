<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Watermelon AI">
  <title>Watermelon AI</title>

  <!-- Safe area for maskable icons: artwork stays inside the inner 80% -->
  <rect width="512" height="512" rx="112" fill="#f9f9ff"/>

  <!-- Rind: forest green, the secondary brand tone -->
  <path d="M54 186h404c0 165-91 262-202 262S54 351 54 186Z" fill="#1b6b44"/>

  <!-- Pith -->
  <path d="M91 186h330c0 139-74 221-165 221S91 325 91 186Z" fill="#ffffff"/>

  <!-- Flesh: crimson seedless -->
  <path d="M117 186h278c0 118-62 187-139 187S117 304 117 186Z" fill="#e12149"/>

  <!-- Seeds -->
  <g fill="#111c2d">
    <ellipse cx="186" cy="250" rx="15" ry="21"/>
    <ellipse cx="326" cy="250" rx="15" ry="21"/>
    <ellipse cx="256" cy="312" rx="15" ry="21"/>
  </g>

  <!-- Circuit traces growing out of the rind: the "AI" half of the mark -->
  <g fill="none" stroke="#1b6b44" stroke-width="17" stroke-linecap="round">
    <path d="M352 222 418 156"/>
    <path d="M256 352v56"/>
  </g>
  <circle cx="428" cy="146" r="19" fill="#ffffff" stroke="#1b6b44" stroke-width="15"/>
  <circle cx="256" cy="418" r="19" fill="#ffffff" stroke="#1b6b44" stroke-width="15"/>

  <path d="M160 222 100 162" fill="none" stroke="#ba0035" stroke-width="17" stroke-linecap="round"/>
  <circle cx="90" cy="152" r="19" fill="#ffffff" stroke="#ba0035" stroke-width="15"/>
</svg>
